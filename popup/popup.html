<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Live Caption</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <div class="logo-icon">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <rect x="2" y="18" width="24" height="3" rx="1.5" fill="white" opacity="0.9"/>
            <rect x="5" y="12" width="18" height="3" rx="1.5" fill="white" opacity="0.6"/>
            <rect x="8" y="6" width="12" height="3" rx="1.5" fill="white" opacity="0.3"/>
          </svg>
        </div>
        <div class="logo-text">
          <h1>Gemini Live Caption</h1>
          <p class="subtitle">AI-powered real-time translation</p>
        </div>
      </div>
      <div class="status-badge" id="statusBadge">
        <span class="status-dot"></span>
        <span class="status-text">Ready</span>
      </div>
    </header>

    <!-- Toggle Button -->
    <button class="toggle-btn" id="toggleBtn">
      <span class="toggle-icon" id="toggleIcon">▶</span>
      <span class="toggle-label" id="toggleLabel">Start Caption</span>
    </button>

    <div class="divider"></div>

    <!-- Settings -->
    <div class="settings">
      <!-- API Key -->
      <div class="setting-group">
        <label class="setting-label" for="apiKey">🔑 API Key</label>
        <div class="input-wrapper">
          <input type="password" id="apiKey" class="setting-input" placeholder="Enter your Gemini API key" autocomplete="off">
          <button class="eye-btn" id="toggleApiKey" title="Show/hide API key">👁</button>
        </div>
      </div>

      <!-- Target Language -->
      <div class="setting-group">
        <label class="setting-label" for="targetLanguage">🌐 Target Language</label>
        <select id="targetLanguage" class="setting-select">
          <option value="zh-Hans">中文 (简体)</option>
          <option value="zh-Hant">中文 (繁體)</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="es">Español</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
          <option value="ru">Русский</option>
          <option value="pt-BR">Português (BR)</option>
          <option value="pt-PT">Português (PT)</option>
          <option value="ar">العربية</option>
          <option value="hi">हिन्दी</option>
        </select>
      </div>

      <!-- Font Size -->
      <div class="setting-group">
        <label class="setting-label">📏 Font Size</label>
        <div class="segmented-control" id="fontSizeControl">
          <button class="seg-btn" data-value="small">S</button>
          <button class="seg-btn active" data-value="medium">M</button>
          <button class="seg-btn" data-value="large">L</button>
        </div>
      </div>

      <!-- Opacity -->
      <div class="setting-group">
        <label class="setting-label">🎨 Background Opacity <span id="opacityValue" class="setting-value">75%</span></label>
        <input type="range" id="bgOpacity" class="setting-range" min="0" max="100" value="75">
      </div>

      <!-- Audio Gain -->
      <div class="setting-group">
        <label class="setting-label">🔊 Audio Gain <span id="gainValue" class="setting-value">1.0x</span></label>
        <input type="range" id="audioGain" class="setting-range" min="10" max="50" value="10" step="1">
      </div>

      <!-- VAD Sensitivity -->
      <div class="setting-group">
        <label class="setting-label">🎙️ Voice Detection</label>
        <div class="segmented-control" id="vadControl">
          <button class="seg-btn active" data-value="HIGH">Sensitive</button>
          <button class="seg-btn" data-value="LOW">Relaxed</button>
        </div>
      </div>

      <!-- Noise Gate -->
      <div class="setting-group">
        <label class="setting-label">🔇 Noise Gate <span id="gateValue" class="setting-value">Off</span></label>
        <input type="range" id="noiseGate" class="setting-range" min="0" max="50" value="0" step="1">
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <span class="shortcut-hint">⌨️ Press <kbd>Alt+C</kbd> to toggle</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
