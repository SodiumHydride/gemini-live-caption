<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="app_name">Gemini Live Caption</title>
  <link rel="stylesheet" href="pip.css">
  <!-- i18n and caption-track must load before pip.js. All src paths are rewritten to absolute
       chrome-extension:// URLs by content.js before this HTML is written into
       the PiP window. -->
  <script src="i18n.js" defer></script>
  <script src="caption-track.js" defer></script>
  <script src="pip.js" defer></script>
</head>
<body>
  <div id="pip-root">
    <!-- Top bar: settings + close -->
    <div id="toolbar">
      <button id="settings-btn" aria-label="Settings" data-i18n-attr="aria-label:pip_settings_title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
      </button>
      <button id="close-btn" aria-label="Close">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- Subtitle display -->
    <div id="lines"></div>
    <div id="placeholder" class="show" data-i18n="app_name">Gemini Live Caption</div>

    <!-- Settings panel (hidden by default) -->
    <div id="settings-panel" class="hidden">
      <div class="sp-title" data-i18n="pip_settings_title">Caption Settings</div>
      <div class="sp-row">
        <label data-i18n="pip_font_size">Font Size</label>
        <div class="sp-seg" id="sp-fontsize">
          <button data-v="small">S</button>
          <button data-v="medium" class="on">M</button>
          <button data-v="large">L</button>
          <button data-v="xlarge">XL</button>
        </div>
      </div>
      <div class="sp-row">
        <label data-i18n="pip_max_lines">Max Lines</label>
        <div class="sp-seg" id="sp-maxlines">
          <button data-v="2" class="on">2</button>
          <button data-v="3">3</button>
          <button data-v="4">4</button>
          <button data-v="5">5</button>
        </div>
      </div>
      <div class="sp-row">
        <label data-i18n="pip_background">Background</label>
        <input type="range" id="sp-opacity" min="0" max="100" value="80">
        <span id="sp-opacity-val">80%</span>
      </div>
      <div class="sp-row">
        <label data-i18n="pip_text_color">Text Color</label>
        <div class="sp-colors" id="sp-color">
          <button data-v="#ffffff" class="on" style="background:#ffffff" title="White" data-i18n-attr="title:color_white"></button>
          <button data-v="#f0f0f0" style="background:#f0f0f0" title="Light Gray" data-i18n-attr="title:color_light_gray"></button>
          <button data-v="#ffeb3b" style="background:#ffeb3b" title="Yellow" data-i18n-attr="title:color_yellow"></button>
          <button data-v="#4fc3f7" style="background:#4fc3f7" title="Light Blue" data-i18n-attr="title:color_light_blue"></button>
          <button data-v="#81c784" style="background:#81c784" title="Light Green" data-i18n-attr="title:color_light_green"></button>
          <button data-v="#ff8a65" style="background:#ff8a65" title="Orange" data-i18n-attr="title:color_orange"></button>
        </div>
      </div>
    </div>

    <!-- History panel overlay -->
    <div id="history-overlay" class="history-overlay"></div>

    <!-- History panel (hidden by default, shown on double-click) -->
    <div id="history-panel" class="history-panel">
      <div class="history-header">
        <span class="history-title" data-i18n="overlay_transcript">Transcript</span>
        <button id="history-close" class="history-close">×</button>
      </div>
      <div id="history-scroll" class="history-scroll"></div>
    </div>
  </div>
</body>
</html>
